<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KITAMJS - Kelompok MJS</title>
    <style>
        /* --- GLOBAL STYLES --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #222;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- STYLE LANDING PAGE --- */
        #landing-page {
            text-align: center;
            animation: fadeIn 0.8s ease-in-out;
            padding: 20px;
            width: 100%;
            max-width: 500px;
        }

        .title {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: -webkit-linear-gradient(#ff9f43, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .subtitle { margin-bottom: 30px; color: #ccc; font-size: 1.1rem; }

        .team-card {
            background-color: #333;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            text-align: left;
        }

        .team-card h3 {
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
            margin-bottom: 15px;
            color: #ff9f43;
        }

        .member-list { list-style: none; }
        .member-list li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #444; font-size: 1rem; }
        .member-list li:last-child { border-bottom: none; }
        .nim { color: #aaa; font-family: monospace; font-size: 1.1rem; }

        /* Style tombol sebagai Link (a tag) */
        .btn-start {
            display: inline-block;
            text-decoration: none; /* Hilangkan garis bawah link */
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
        }

        .btn-start:hover {
            background-color: #27ae60;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(46, 204, 113, 0.6);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="landing-page">
        <h1 class="title">KITAMJS</h1>
        <p class="subtitle">Project Kalkulator Web</p>

        <div class="team-card">
            <h3>Anggota Kelompok</h3>
            <ul class="member-list">
                <li>
                    <span>Elika Putri Wicaksana</span>
                    <span class="nim">2405551093</span>
                </li>
                <li>
                    <span>Ni Made Mita Dwi Ulandari</span>
                    <span class="nim">2405551042</span>
                </li>
                <li>
                    <span>Hanna Chrysantha Sukmana</span>
                    <span class="nim">2405551170</span>
                </li>
                <li>
                    <span>Laurencia Princess Cwa Inkiriwang</span>
                    <span class="nim">2405551184</span>
                </li>
            </ul>
        </div>
        <a href="kalkulator.html" class="btn-start">Buka Kalkulator 🚀</a>
    </div>
</body>
</html>
